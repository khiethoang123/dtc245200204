services:
  # ============================================================================
  # 1. NGINX REVERSE PROXY & HARDENING (HTTPS + SECURITY HEADERS)
  # ============================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: production-nginx
    restart: always
    ports:
      - "8080:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - frontend-net
      - monitoring-net
    depends_on:
      wordpress:
        condition: service_healthy
      phpmyadmin:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80 || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ============================================================================
  # 2. WORDPRESS APPLICATION (WEBSITE QUẢNG BÁ SẢN PHẨM)
  # ============================================================================
  wordpress:
    image: wordpress:6.7-apache
    container_name: production-wordpress
    restart: always
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST:-mysql:3306}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wp_user}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-WP_Database_P@ssw0rd_2026!}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress_db}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-0}
      # Hardening: Tắt sửa file giao diện/plugin trực tiếp, ép buộc SSL sau Reverse Proxy
      WORDPRESS_CONFIG_EXTRA: |
        define('DISALLOW_FILE_EDIT', true);
        define('FORCE_SSL_ADMIN', true);
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
            $$_SERVER['HTTPS'] = 'on';
        }
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    networks:
      - frontend-net
      - backend-net
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/wp-admin/install.php"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ============================================================================
  # 3. MYSQL DATABASE 8.0 (CƠ SỞ DỮ LIỆU ĐÃ ĐƯỢC HARDENING)
  # ============================================================================
  mysql:
    image: mysql:8.0
    container_name: production-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-MySQL_Root_P@ssw0rd_Secure_2026!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress_db}
      MYSQL_USER: ${MYSQL_USER:-wp_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-WP_Database_P@ssw0rd_2026!}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    # HARDENING: Mạng cô lập - Không mở cổng 3306 ra ngoài host, chỉ truy cập trong backend-net
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-MySQL_Root_P@ssw0rd_Secure_2026!}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================================
  # 4. PHPMYADMIN (CÔNG CỤ QUẢN TRỊ CƠ SỞ DỮ LIỆU)
  # ============================================================================
  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: production-phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: https://localhost/pma/
      UPLOAD_LIMIT: 64M
    networks:
      - frontend-net
      - backend-net
    depends_on:
      mysql:
        condition: service_healthy

  # ============================================================================
  # 5. PROMETHEUS (HỆ THỐNG THU THẬP & LƯU TRỮ METRICS THỜI GIAN THỰC)
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: production-prometheus
    restart: always
    user: "nobody" # Non-root container (Hardening)
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring-net
      - frontend-net

  # ============================================================================
  # 6. GRAFANA (GIAO DIỆN TRỰC QUAN HÓA CHỈ SỐ DASHBOARDS)
  # ============================================================================
  grafana:
    image: grafana/grafana:10.4.0
    container_name: production-grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-Grafana_Admin_Secured_2026!}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring-net
      - frontend-net
    depends_on:
      - prometheus

  # ============================================================================
  # 7. CADVISOR (GIÁM SÁT TÀI NGUYÊN TOÀN BỘ CONTAINERS DOCKER)
  # ============================================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: production-cadvisor
    restart: always
    ports:
      - "${CADVISOR_PORT:-8081}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring-net

  # ============================================================================
  # 8. MYSQL EXPORTER (XUẤT CHỈ SỐ DATABASE MYSQL SANG PROMETHEUS)
  # ============================================================================
  mysql-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: production-mysql-exporter
    restart: always
    ports:
      - "${MYSQL_EXPORTER_PORT:-9104}:9104"
    environment:
      DATA_SOURCE_NAME: "exporter:${MYSQL_EXPORTER_PASSWORD:-Exporter_Secure_P@ss_2026!}@(mysql:3306)/"
    networks:
      - backend-net
      - monitoring-net
    depends_on:
      mysql:
        condition: service_healthy

  # ============================================================================
  # 9. NGINX EXPORTER (XUẤT CHỈ SỐ TRAFFIC VÀ KẾT NỐI NGINX SANG PROMETHEUS)
  # ============================================================================
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: production-nginx-exporter
    restart: always
    ports:
      - "${NGINX_EXPORTER_PORT:-9113}:9113"
    command:
      - -nginx.scrape-uri=http://nginx:8080/stub_status
    networks:
      - frontend-net
      - monitoring-net
    depends_on:
      - nginx

  # ============================================================================
  # 10. NODE EXPORTER (GIÁM SÁT TÀI NGUYÊN MÁY CHỦ HOST)
  # ============================================================================
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: production-node-exporter
    restart: always
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring-net

  # ============================================================================
  # 11. GRAFANA LOKI (HỆ THỐNG LƯU TRỮ VÀ XỬ LÝ LOG TẬP TRUNG)
  # ============================================================================
  loki:
    image: grafana/loki:2.9.4
    container_name: production-loki
    restart: always
    user: "10001:10001" # Non-root Hardening
    ports:
      - "${LOKI_PORT:-3100}:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./logging/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - monitoring-net

  # ============================================================================
  # 12. PROMTAIL (AGENTS THU THẬP VÀ ĐẨY LOG VỀ LOKI)
  # ============================================================================
  promtail:
    image: grafana/promtail:2.9.4
    container_name: production-promtail
    restart: always
    ports:
      - "9085:9090"
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./logging/promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
      - nginx_logs:/var/log/nginx:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - monitoring-net
    depends_on:
      - loki

# ==============================================================================
# PHÂN TẦNG MẠNG (NETWORK ISOLATION - HARDENING)
# ==============================================================================
networks:
  frontend-net:
    driver: bridge
    name: net_production_frontend
  backend-net:
    driver: bridge
    name: net_production_backend
  monitoring-net:
    driver: bridge
    name: net_production_monitoring

# ==============================================================================
# LƯU TRỮ DỮ LIỆU (PERSISTENT VOLUMES)
# ==============================================================================
volumes:
  mysql_data:
    name: vol_production_mysql_data
  wordpress_data:
    name: vol_production_wordpress_data
  nginx_logs:
    name: vol_production_nginx_logs
  prometheus_data:
    name: vol_production_prometheus_data
  grafana_data:
    name: vol_production_grafana_data
  loki_data:
    name: vol_production_loki_data

# ==============================================================================
# CẤU HÌNH TỰ ĐỘNG DATASOURCES CHO GRAFANA (PROMETHEUS + LOKI)
# ==============================================================================
apiVersion: 1

datasources:
  # 1. Nguồn dữ liệu chỉ số thời gian thực Prometheus (Default)
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s
      httpMethod: POST

  # 2. Nguồn dữ liệu Log tập trung Grafana Loki
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000

# ==============================================================================
# CẤU HÌNH NGINX REVERSE PROXY & HARDENING CHO DỰ ÁN WORDPRESS
# ==============================================================================

# Khởi tạo vùng giới hạn tốc độ truy cập (Rate Limiting) phòng chống Brute Force / DoS
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=3r/s;

# Định nghĩa các Upstream dịch vụ nội bộ Docker
upstream wordpress_backend {
    server wordpress:80;
    keepalive 32;
}

upstream phpmyadmin_backend {
    server phpmyadmin:80;
    keepalive 16;
}

upstream grafana_backend {
    server grafana:3000;
    keepalive 16;
}

# ------------------------------------------------------------------------------
# 1. HTTP Server - Tự động chuyển hướng toàn bộ sang HTTPS (301 Moved Permanently)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    # Ẩn phiên bản Nginx (Hardening)
    server_tokens off;

    # Chuyển hướng HTTPS an toàn
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server - Reverse Proxy an toàn với SSL & Security Headers
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name localhost _;

    # Ẩn phiên bản Nginx
    server_tokens off;

    # Cấu hình SSL / TLS
    ssl_certificate /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Nhúng các Security Headers bảo vệ hệ thống
    include /etc/nginx/security-headers.conf;

    # Giới hạn kích thước tải lên (phù hợp upload sản phẩm WordPress)
    client_max_body_size 64M;
    client_body_buffer_size 128k;

    # Thời gian chờ
    proxy_connect_timeout 90;
    proxy_send_timeout 90;
    proxy_read_timeout 90;
    proxy_buffers 32 4k;

    # Ghi log chuẩn định dạng chi tiết có thời gian xử lý phục vụ Loki/Promtail
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # --------------------------------------------------------------------------
    # HARDENING: Chặn các lỗ hổng WordPress phổ biến
    # --------------------------------------------------------------------------
    # 1. Chặn tấn công XML-RPC (nguồn gốc của các vụ DDoS và brute force WordPress)
    location = /xmlrpc.php {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 2. Ngăn chặn thực thi script PHP trong thư mục tải lên uploads
    location ~* /wp-content/uploads/.*\.php$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 3. Chặn truy cập vào các file cấu hình, ẩn và nhạy cảm (.env, .git, .htaccess)
    location ~* /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 4. Giới hạn tốc độ trang đăng nhập wp-login.php chống brute force mật khẩu
    location = /wp-login.php {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://wordpress_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    # --------------------------------------------------------------------------
    # ĐỊNH TUYẾN DỊCH VỤ CHÍNH: WEBSITE WORDPRESS
    # --------------------------------------------------------------------------
    location / {
        limit_req zone=general_limit burst=30 nodelay;
        proxy_pass http://wordpress_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    # --------------------------------------------------------------------------
    # ĐỊNH TUYẾN CÔNG CỤ QUẢN TRỊ CƠ SỞ DỮ LIỆU: PHPMYADMIN
    # --------------------------------------------------------------------------
    location /pma/ {
        proxy_pass http://phpmyadmin_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    # --------------------------------------------------------------------------
    # ĐỊNH TUYẾN DASHBOARD GIÁM SÁT: GRAFANA
    # --------------------------------------------------------------------------
    location /grafana/ {
        proxy_pass http://grafana_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

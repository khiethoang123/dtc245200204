# ==============================================================================
# CỔNG METRICS NỘI BỘ DÀNH CHO PROMETHEUS NGINX EXPORTER
# ==============================================================================
server {
    listen 8080;
    server_name localhost;

    location /stub_status {
        stub_status;
        # Chỉ cho phép các dải mạng Docker nội bộ truy cập
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny all;
        access_log off;
    }
}

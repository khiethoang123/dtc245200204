# ==============================================================================
# BẢO MẬT HỆ THỐNG - SECURITY HEADERS CHO NGINX REVERSE PROXY
# ==============================================================================

# Ngăn chặn Clickjacking bằng cách không cho phép nhúng vào iframe từ trang khác
add_header X-Frame-Options "SAMEORIGIN" always;

# Ngăn chặn trình duyệt đoán định kiểu MIME (MIME-type sniffing)
add_header X-Content-Type-Options "nosniff" always;

# Bật bộ lọc XSS của trình duyệt cổ điển
add_header X-XSS-Protection "1; mode=block" always;

# Ép buộc kết nối mã hóa HTTPS qua giao thức HSTS
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Kiểm soát thông tin Referrer để bảo vệ quyền riêng tư người dùng
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Giới hạn các API nhạy cảm của trình duyệt (Microphone, Camera, Geolocation)
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# Content Security Policy (CSP) tối ưu cho WordPress và phpMyAdmin
add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'self';" always;
